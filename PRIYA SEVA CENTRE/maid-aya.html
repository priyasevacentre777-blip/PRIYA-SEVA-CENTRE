<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire a Maid / Aya - Priya Seva Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        priyaRed: '#DC143C',
                        priyaNavy: '#1E3A8A',
                        priyaYellow: '#FBBF24'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans relative min-h-screen flex flex-col">

    <header class="bg-white shadow-md p-4 flex items-center fixed w-full top-0 z-40">
        <a href="index.html" class="text-priyaNavy text-2xl absolute left-5 focus:outline-none">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="flex flex-col items-center mx-auto">
            <h1 class="text-priyaRed text-xl font-extrabold tracking-tight uppercase text-center">MAID / AYA SERVICES</h1>
        </div>
    </header>

    <main class="mt-24 p-4 flex-grow flex flex-col items-center justify-start w-full max-w-md mx-auto relative">

        <div id="serviceList" class="w-full transition-opacity duration-500 opacity-100 absolute top-0 left-0 w-full px-4">
            <p class="text-center text-gray-600 mb-6 font-medium">Select the services you require:</p>
            
            <div class="space-y-4 mb-8">
                <div class="flex items-center bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                    <div class="bg-gray-200 h-12 w-12 rounded-full flex items-center justify-center text-gray-500 mr-4 shrink-0">
                        <i class="fa-solid fa-utensils"></i> </div>
                    <span class="text-lg font-bold text-priyaNavy uppercase">1. Cooking</span>
                </div>
                
                <div class="flex items-center bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                    <div class="bg-gray-200 h-12 w-12 rounded-full flex items-center justify-center text-gray-500 mr-4 shrink-0">
                        <i class="fa-solid fa-broom"></i> </div>
                    <span class="text-lg font-bold text-priyaNavy uppercase">2. Cleaning</span>
                </div>

                <div class="flex items-center bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                    <div class="bg-gray-200 h-12 w-12 rounded-full flex items-center justify-center text-gray-500 mr-4 shrink-0">
                        <i class="fa-solid fa-shirt"></i> </div>
                    <span class="text-lg font-bold text-priyaNavy uppercase">3. Laundry</span>
                </div>

                <div class="flex items-center bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                    <div class="bg-gray-200 h-12 w-12 rounded-full flex items-center justify-center text-gray-500 mr-4 shrink-0">
                        <i class="fa-solid fa-hand-holding-heart"></i> </div>
                    <span class="text-lg font-bold text-priyaNavy uppercase">4. Specialised Care</span>
                </div>
            </div>

            <button id="requestBtn" class="w-full bg-priyaRed text-white font-bold py-4 rounded-lg shadow-lg text-lg hover:bg-red-700 transition uppercase tracking-wide">
                Request Service
            </button>
        </div>

        <div id="contactForm" class="w-full transition-opacity duration-500 opacity-0 pointer-events-none absolute top-0 left-0 w-full px-4 invisible">
            <h2 class="text-center text-xl font-bold text-priyaNavy mb-6 uppercase">Enter Your Details</h2>
            
            <form id="quoteForm" class="space-y-5 bg-white p-6 rounded-lg shadow-md border border-gray-100">
                <div>
                    <label class="block text-gray-700 font-bold mb-2 text-sm uppercase">Name</label>
                    <input type="text" required class="w-full px-4 py-3 rounded border border-gray-300 focus:outline-none focus:border-priyaNavy focus:ring-1 focus:ring-priyaNavy">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-2 text-sm uppercase">Address</label>
                    <textarea required rows="2" class="w-full px-4 py-3 rounded border border-gray-300 focus:outline-none focus:border-priyaNavy focus:ring-1 focus:ring-priyaNavy"></textarea>
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-2 text-sm uppercase">Phone Number</label>
                    <input type="tel" required class="w-full px-4 py-3 rounded border border-gray-300 focus:outline-none focus:border-priyaNavy focus:ring-1 focus:ring-priyaNavy">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-2 text-sm uppercase">Email (Optional)</label>
                    <input type="email" class="w-full px-4 py-3 rounded border border-gray-300 focus:outline-none focus:border-priyaNavy focus:ring-1 focus:ring-priyaNavy">
                </div>

                <button type="button" id="getQuotesBtn" class="w-full bg-priyaNavy text-white font-bold py-4 rounded-lg shadow-lg text-lg hover:bg-blue-900 transition mt-4 uppercase tracking-wide">
                    Get Quotes
                </button>
            </form>
        </div>

        <div id="successMsg" class="w-full transition-opacity duration-500 opacity-0 pointer-events-none absolute top-10 left-0 w-full px-4 text-center invisible">
            <div class="bg-green-100 border border-green-400 p-8 rounded-xl shadow-md">
                <i class="fa-solid fa-circle-check text-green-500 text-6xl mb-4"></i>
                <h2 class="text-xl font-bold text-gray-800 mb-4 uppercase">Request Received</h2>
                <p class="text-gray-600 font-medium mb-8">We have received your request and our team will contact you within 24 hours.</p>
                
                <a href="index.html" class="inline-block w-full bg-priyaNavy text-white font-bold py-4 rounded-lg shadow-lg text-lg hover:bg-blue-900 transition uppercase tracking-wide">
                    Take Me Back
                </a>
            </div>
        </div>

    </main>

    <script>
        const serviceList = document.getElementById('serviceList');
        const contactForm = document.getElementById('contactForm');
        const successMsg = document.getElementById('successMsg');
        
        const requestBtn = document.getElementById('requestBtn');
        const getQuotesBtn = document.getElementById('getQuotesBtn');

        // Helper function to fade between sections
        function fadeTransition(fadeOutElement, fadeInElement) {
            // Fade out
            fadeOutElement.classList.remove('opacity-100');
            fadeOutElement.classList.add('opacity-0');
            fadeOutElement.classList.add('pointer-events-none');
            
            setTimeout(() => {
                fadeOutElement.classList.add('invisible');
                
                // Fade in
                fadeInElement.classList.remove('invisible');
                fadeInElement.classList.remove('pointer-events-none');
                fadeInElement.classList.remove('opacity-0');
                fadeInElement.classList.add('opacity-100');
            }, 500); // 500ms matches the duration-500 in Tailwind
        }

        // 1. From Service List to Contact Form
        requestBtn.addEventListener('click', () => {
            fadeTransition(serviceList, contactForm);
        });

        // 2. From Contact Form to Success Message
        getQuotesBtn.addEventListener('click', () => {
            // In a real scenario, you would validate the form and send data to Formspree here.
            // For now, we instantly show the success screen as requested.
            fadeTransition(contactForm, successMsg);
        });
    </script>

</body>
</html>
