<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priya Seva Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        priyaRed: '#DC143C',   /* Crimson Red */
                        priyaNavy: '#1E3A8A',  /* Navy Blue */
                        priyaYellow: '#FBBF24' /* Accent Yellow */
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-gray-800 font-sans relative overflow-x-hidden">

    <header class="bg-white shadow-md p-4 flex justify-between items-center fixed w-full top-0 z-40">
        <div class="flex flex-col items-center mx-auto">
            <i class="fa-solid fa-plus text-priyaRed text-4xl mb-1"></i>
            <h1 class="text-priyaRed text-2xl font-extrabold tracking-tight uppercase text-center">Priya Seva Center</h1>
        </div>
        
        <button id="menuBtn" class="absolute right-5 top-8 text-priyaNavy text-3xl focus:outline-none">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <main class="mt-32 p-4">
        </main>

    <div id="sideMenu" class="fixed top-0 right-0 h-full w-64 bg-priyaNavy text-white transform translate-x-full transition-transform duration-300 ease-in-out z-50 shadow-2xl">
        <div class="p-4 flex justify-end">
            <button id="closeBtn" class="text-white text-4xl focus:outline-none hover:text-priyaRed">&times;</button>
        </div>
        
        <ul class="flex flex-col space-y-8 px-8 mt-10 text-xl font-semibold">
            <li><a href="#" class="hover:text-priyaYellow transition duration-200">About Us</a></li>
            <li><a href="#" class="hover:text-priyaYellow transition duration-200">Share Your Feedback</a></li>
            <li><a href="#" class="hover:text-priyaYellow transition duration-200">Terms and Conditions</a></li>
        </ul>
    </div>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');
        const sideMenu = document.getElementById('sideMenu');

        // Open Menu (Removes the translate class to slide it in)
        menuBtn.addEventListener('click', () => {
            sideMenu.classList.remove('translate-x-full');
        });

        // Close Menu (Adds the translate class to slide it out)
        closeBtn.addEventListener('click', () => {
            sideMenu.classList.add('translate-x-full');
        });
    </script>
</body>
</html>
